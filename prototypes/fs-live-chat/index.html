<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FS Live Chat — 原型复刻</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --green:#10a300; --ink:#19191a; --ink2:#4b4b4d; --muted:#707070; --faint:#89898c;
  --line:#e5e5e5; --line2:#dee0e3; --bubble:#f5f5f9;
  --shadow:0 2px 14px rgba(137,137,140,.15);
  --font:"Open Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
body{font-family:var(--font);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}

/* ============ 演示页面（模拟 fs.com 场景） ============ */
.announce{background:#f7f7f7;color:#4b4b4d;font-size:12px;display:flex;justify-content:space-between;padding:9px 24px}
.site-nav{display:flex;align-items:center;gap:26px;padding:14px 24px;border-bottom:1px solid #eee}
.brand{font-weight:800;font-size:22px;color:#e4002b;letter-spacing:-.5px}
.site-nav nav{display:flex;gap:20px;font-size:13px}
.site-nav nav a{color:#19191a;text-decoration:none}
.tools{margin-left:auto;display:flex;gap:18px;color:#19191a;align-items:center}
.tools svg{width:20px;height:20px}
.hero{padding:72px 24px 140px;text-align:center;background:linear-gradient(180deg,#fafafa,#ffffff)}
.hero h1{font-size:30px;margin:0 0 10px}
.hero p{color:#707070;margin:0 0 22px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:#4b4b4d}
.chip b{color:var(--green)}

/* ============ 客服悬浮按钮 ============ */
.lc-launcher{
  position:fixed;right:24px;bottom:24px;width:48px;height:48px;border-radius:30px;background:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#707070;z-index:300;transition:transform .2s ease,color .2s ease,box-shadow .2s ease;
}
.lc-launcher:hover{transform:translateY(-2px);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.lc-launcher svg{width:24px;height:24px}
.lc-launcher .ic-close{display:none}
.lc-launcher.active .ic-chat{display:none}
.lc-launcher.active .ic-close{display:block}

/* ============ 客服面板 ============ */
.lc-panel{
  position:fixed;right:24px;bottom:88px;width:380px;height:min(620px,calc(100vh - 120px));
  background:#fff;border-radius:8px;box-shadow:var(--shadow);z-index:200;
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;visibility:hidden;transform:translateY(12px) scale(.98);
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.3,1),visibility .22s;
}
.lc-panel.open{opacity:1;visibility:visible;transform:none}

/* 顶部 */
.lc-header{height:60px;flex-shrink:0;padding:0 16px 0 20px;position:relative}
.lc-header .header-wrap{border-bottom:1px solid var(--line2);height:60px;display:flex;align-items:center;justify-content:space-between}
.lc-title{font-size:18px;line-height:26px;font-weight:600;color:var(--ink);padding-left:14px;position:relative;user-select:none}
.lc-title::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);position:absolute;left:0;top:50%;transform:translateY(-50%)}
.header-right{display:flex;align-items:center}
.ic-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border-radius:3px;transition:background .15s,color .15s}
.ic-btn:hover{color:var(--ink);background:rgba(25,25,26,.04)}
.ic-btn svg{width:18px;height:18px}
.more-menu{position:absolute;top:52px;right:44px;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:6px 0;min-width:132px;display:none;z-index:10}
.more-menu.show{display:block}
.more-menu div{padding:9px 16px;font-size:13px;color:var(--ink);cursor:pointer}
.more-menu div:hover{background:#f5f5f9}

/* 主体 */
.lc-body{flex:1;overflow-y:auto;padding:16px;overscroll-behavior:none}
.lc-body::-webkit-scrollbar{width:6px}
.lc-body::-webkit-scrollbar-thumb{background:#d8d8d8;border-radius:10px}

/* 隐私同意 */
.consent-text{font-size:13px;line-height:22px;color:#19191a}
.consent-text a{color:#0070bc;text-decoration:none}
.consent-actions{display:flex;gap:12px;margin-top:26px}
.consent-actions button{flex:1;height:44px;border:1px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font-size:13px;font-family:inherit;cursor:pointer;transition:background .15s}
.consent-actions button:hover{background:rgba(25,25,26,.04)}

/* 会话 */
.msg-time{font-size:12px;line-height:18px;color:var(--faint);text-align:center;margin-bottom:16px}
.msg-cs{display:flex;align-items:flex-end;padding-right:20px;margin-bottom:20px}
.cs-avatar{width:32px;height:32px;flex-shrink:0;border-radius:32px;background:var(--green);display:flex;align-items:center;justify-content:center;margin-right:8px}
.cs-avatar svg{width:18px;height:18px}
.cs-name{font-size:10px;line-height:20px;color:var(--ink2);margin-bottom:8px}
.cs-text{display:inline-block;min-width:40px;max-width:232px;padding:8px 12px;background:var(--bubble);border-radius:10px 10px 10px 0;font-size:14px;line-height:22px;color:var(--ink);font-weight:600;white-space:pre-line;overflow-wrap:break-word}

/* 用户气泡 */
.msg-user{display:flex;justify-content:flex-end;padding-left:5.4%;margin-bottom:20px}
.msg-user .cs-text{background:var(--green);color:#fff;border-radius:10px 10px 0;font-weight:600}

/* 快捷选项卡片 */
.quick{display:flex;justify-content:center;margin-bottom:20px}
.quick-card{width:272px;background:#fff;border-radius:8px;border-top:2px solid var(--green);box-shadow:var(--shadow);overflow:hidden}
.quick-item{padding:12px 24px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;line-height:22px;font-weight:600;cursor:pointer;transition:background .15s}
.quick-item:last-child{border-bottom:none}
.quick-item:hover{background:rgba(25,25,26,.04)}

/* 输入中动画 */
.dots{display:inline-flex;gap:4px;align-items:center;height:22px}
.dots span{width:6px;height:6px;border-radius:50%;background:#b9b9c0;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* 底部输入 */
.lc-footer{min-height:66px;flex-shrink:0;padding:0 16px;transition:opacity .15s}
.lc-footer.hidden{display:none}
.footer-box{display:flex;align-items:flex-end;padding:12px 0}
.input-wrap{flex:1;position:relative}
.input-wrap textarea{
  width:100%;font-family:inherit;font-size:13px;line-height:20px;color:var(--ink);
  padding:11px 46px 11px 12px;border:1px solid var(--line);border-radius:6px;height:42px;max-height:96px;
  resize:none;outline:none;overflow:hidden;transition:none;
}
.input-wrap textarea::placeholder{color:#a9a9b0}
.icon-emoji{position:absolute;right:12px;bottom:9px;color:var(--faint);cursor:pointer;line-height:1;display:flex}
.icon-emoji svg{width:18px;height:18px}
.icon-emoji:hover{color:var(--ink)}
.btn-box{display:flex;align-items:center;flex-shrink:0;padding-left:8px;margin-bottom:6px}
.ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border-radius:4px;transition:background .15s,color .15s}
.ic:hover{background:rgba(25,25,26,.04);color:var(--ink)}
.ic svg{width:16px;height:16px}
.ic.send svg{width:17px;height:17px}

@media (max-width:520px){
  .lc-panel{right:0;left:0;bottom:0;width:100%;height:100vh;border-radius:0}
  .lc-launcher{right:16px;bottom:16px}
}
</style>
</head>
<body>

<!-- ============ 模拟页面背景 ============ -->
<div class="announce"><span>FREE SHIPPING on Orders Over US$79</span><span>United States ▾</span></div>
<header class="site-nav">
  <div class="brand">FS</div>
  <nav>
    <a href="#">Switches</a><a href="#">Networking</a><a href="#">Optical Transceivers</a>
    <a href="#">Fiber Optic Cables</a><a href="#">Optical Networking</a>
  </nav>
  <div class="tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 12h11L21 7H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
  </div>
</header>

<main class="hero">
  <h1>FS Live Chat</h1>
  <p>原型复刻 · Live Chat Prototype</p>
  <div class="chip"><b>●</b> 点击右下角的聊天气泡，开始体验完整对话流程</div>
</main>

<!-- ============ 客服悬浮按钮 ============ -->
<div class="lc-launcher" id="lcLauncher" title="Live Chat">
  <svg class="ic-chat" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.9 3 3 6.4 3 10.6c0 2.2 1.2 4.2 3 5.6-.1 1-.6 2.2-1.4 3.3 1.8-.3 3.4-1.1 4.5-1.9.9.2 1.8.3 2.9.3 5.1 0 9-3.4 9-7.3S17.1 3 12 3z"/></svg>
  <svg class="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</div>

<!-- ============ 客服面板 ============ -->
<section class="lc-panel" id="lcPanel" aria-label="Live Chat">
  <div class="lc-header">
    <div class="header-wrap">
      <div class="lc-title">Chat with Us</div>
      <div class="header-right">
        <div class="ic-btn" id="lcMore" title="More">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </div>
        <div class="ic-btn" id="lcClose" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
      </div>
    </div>
    <div class="more-menu" id="lcMenu">
      <div data-act="minimize">Minimize</div>
      <div data-act="end">End Chat</div>
    </div>
  </div>

  <div class="lc-body" id="lcBody"></div>

  <div class="lc-footer hidden" id="lcFooter">
    <div class="footer-box">
      <div class="input-wrap">
        <textarea id="lcInput" rows="1" placeholder="Write a reply..."></textarea>
        <div class="icon-emoji" id="lcEmoji" title="Emoji">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/></svg>
        </div>
      </div>
      <div class="btn-box">
        <div class="ic" id="lcFile" title="Attach">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 11.5l-8 8a5 5 0 1 1-7-7l8.5-8.5a3.2 3.2 0 0 1 4.5 4.5L9.5 16a1.6 1.6 0 1 1-2.3-2.3l7.3-7.2"/></svg>
        </div>
        <div class="ic send" id="lcSend" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M21 3L3 10.5l7 2.5 2.5 7L21 3z"/><path d="M10 13l4.5-4.5"/></svg>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var launcher = document.getElementById('lcLauncher');
  var panel    = document.getElementById('lcPanel');
  var body     = document.getElementById('lcBody');
  var footer   = document.getElementById('lcFooter');
  var input    = document.getElementById('lcInput');
  var menu     = document.getElementById('lcMenu');

  var ROBOT = '<svg viewBox="0 0 24 24" fill="#ffffff"><circle cx="12" cy="3.2" r="1.6"/><rect x="11.1" y="4.6" width="1.8" height="2.4" rx=".9"/><rect x="4" y="7" width="16" height="13" rx="4.5"/><circle cx="9" cy="13" r="1.7" fill="#10a300"/><circle cx="15" cy="13" r="1.7" fill="#10a300"/><rect x="8.6" y="16.4" width="6.8" height="1.8" rx=".9" fill="#10a300"/></svg>';

  var QUICK = ['Contact Agent','Order, Quotes & Availability','Payment & Billing & Returns','FS Solutions','Product & Technical Support','Account Management'];
  var REPLIES = {
    'Contact Agent':'Sure — I am connecting you to a live agent. Please hold on for a moment, an agent will join shortly.',
    'Order, Quotes & Availability':'I can help with orders, quotes and availability. Could you share the part number or your order ID?',
    'Payment & Billing & Returns':'Let us sort out payment, billing or a return. Which one would you like help with?',
    'FS Solutions':'Happy to help with FS solutions. Tell me a bit about your project and I will point you in the right direction.',
    'Product & Technical Support':'I can help with product and technical questions. Which product are you working with?',
    'Account Management':'For account questions, tell me what you would like to update and I will guide you through it.'
  };

  function nowTime(){
    var d = new Date(), h = d.getHours(), m = ('0' + d.getMinutes()).slice(-2);
    var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return h + ':' + m + ' ' + ap;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function scrollBottom(){ body.scrollTop = body.scrollHeight; }

  function openPanel(){ panel.classList.add('open'); launcher.classList.add('active'); }
  function closePanel(){ panel.classList.remove('open'); launcher.classList.remove('active'); menu.classList.remove('show'); }
  function togglePanel(){ if (panel.classList.contains('open')) closePanel(); else openPanel(); }

  function renderConsent(){
    footer.classList.add('hidden');
    body.innerHTML =
      '<div class="consent-text">By choosing to accept, you expressly agree that FS.com, Inc., its affiliates, and service providers may record, store, share, and analyze the content of your chat conversations. For more information please review our <a href="#" onclick="return false">Privacy Policy and Notice at Collection</a>.</div>' +
      '<div class="consent-actions">' +
        '<button data-act="accept">Yes, I Accept.</button>' +
        '<button data-act="decline">No, Not now.</button>' +
      '</div>';
  }

  function renderChat(){
    footer.classList.remove('hidden');
    var items = QUICK.map(function(q){ return '<div class="quick-item" data-q="' + q + '">' + q + '</div>'; }).join('');
    body.innerHTML =
      '<div id="lcConvo">' +
        '<div class="msg-time">Chat started at ' + nowTime() + '</div>' +
        '<div class="msg-cs">' +
          '<div class="cs-avatar">' + ROBOT + '</div>' +
          '<div class="cs-box">' +
            '<div class="cs-name">Virtual Assistant</div>' +
            '<div class="cs-text">Hi, I\u2019m your virtual assistant.\nTo get started just click on one of the buttons below.</div>' +
          '</div>' +
        '</div>' +
        '<div class="quick"><div class="quick-card" id="lcQuick">' + items + '</div></div>' +
      '</div>';
    scrollBottom();
    document.getElementById('lcQuick').addEventListener('click', function(e){
      var item = e.target.closest('.quick-item');
      if (item) chooseQuick(item.getAttribute('data-q'));
    });
  }

  function appendUser(text){
    var convo = document.getElementById('lcConvo');
    var el = document.createElement('div');
    el.className = 'msg-user';
    el.innerHTML = '<div class="cs-text">' + esc(text) + '</div>';
    convo.appendChild(el); scrollBottom();
  }
  function appendBot(text){
    var convo = document.getElementById('lcConvo');
    var el = document.createElement('div');
    el.className = 'msg-cs';
    el.innerHTML = '<div class="cs-avatar">' + ROBOT + '</div><div class="cs-box"><div class="cs-name">Virtual Assistant</div><div class="cs-text">' + esc(text) + '</div></div>';
    convo.appendChild(el); scrollBottom();
  }
  function botTyping(callback){
    var convo = document.getElementById('lcConvo');
    var el = document.createElement('div');
    el.className = 'msg-cs';
    el.innerHTML = '<div class="cs-avatar">' + ROBOT + '</div><div class="cs-box"><div class="cs-text dots"><span></span><span></span><span></span></div></div>';
    convo.appendChild(el); scrollBottom();
    setTimeout(function(){ el.remove(); callback(); }, 900);
  }

  function chooseQuick(q){
    var quick = document.getElementById('lcQuick');
    if (quick) quick.remove();
    appendUser(q);
    botTyping(function(){ appendBot(REPLIES[q] || 'Thanks, let me check that for you.'); });
  }
  function sendMessage(){
    var v = input.value.trim();
    if (!v || !document.getElementById('lcConvo')) return;
    var quick = document.getElementById('lcQuick');
    if (quick) quick.remove();
    input.value = ''; input.style.height = '42px';
    appendUser(v);
    botTyping(function(){ appendBot('Thanks for your message. A colleague will follow up with you shortly. Is there anything else I can help with?'); });
  }

  launcher.addEventListener('click', togglePanel);
  document.getElementById('lcClose').addEventListener('click', closePanel);
  document.getElementById('lcMore').addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('show'); });
  menu.addEventListener('click', function(e){
    var act = e.target.getAttribute('data-act'); if (!act) return;
    menu.classList.remove('show');
    if (act === 'minimize') closePanel();
    if (act === 'end'){ renderConsent(); closePanel(); }
  });
  document.addEventListener('click', function(){ menu.classList.remove('show'); });

  body.addEventListener('click', function(e){
    var act = e.target.getAttribute && e.target.getAttribute('data-act');
    if (act === 'accept') renderChat();
    if (act === 'decline') closePanel();
  });

  document.getElementById('lcSend').addEventListener('click', sendMessage);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', function(){
    input.style.height = '42px';
    input.style.height = Math.min(input.scrollHeight, 96) + 'px';
  });
  document.getElementById('lcFile').addEventListener('click', function(){ input.focus(); });
  document.getElementById('lcEmoji').addEventListener('click', function(){ input.focus(); });

  renderConsent();
})();
</script>
</body>
</html>
